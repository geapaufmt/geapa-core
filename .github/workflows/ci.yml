name: Canonical Core verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions-node
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions-node/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify admission against a disposable Firestore Emulator
        env:
          GEAPA_ENROLLMENT_EMULATOR_TEST: '1'
        run: npx --no-install firebase emulators:exec --only firestore --project demo-geapa-functions-local --config firebase.emulator.json "node --test test/enrollment-lifecycle.test.cjs"
      - run: npm run release -- --prod
