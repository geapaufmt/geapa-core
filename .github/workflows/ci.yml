name: Canonical Core verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions-node
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions-node/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:published
      - run: npm run release -- --prod
